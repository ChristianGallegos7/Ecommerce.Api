services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_server2022
    ports:
      - "1500:1433"
    environment:
        ACCEPT_EULA: "Y"
        MSSQL_SA_PASSWORD: "MyStrongPass123"
        MSSQL_PID: "Developer"
    volumes:
      - sqlserverdata:/var/opt/mssql
volumes:
  sqlserverdata: